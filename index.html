<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아웃리치 기도 후원</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#f6f4ee; --card:#fff; --ink:#1a1a1a; --sub:#5b5b5b; --blue:#1f3b73; --red:#a3242a; --line:#d9d4c7; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; line-height:1.5; }
main { max-width:520px; margin:0 auto; padding:20px 16px 40px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
.hero { text-align:center; }
.hero img { width:120px; border:1px solid #bbb; border-radius:4px; }
h1 { font-size:21px; color:var(--blue); margin:12px 0 4px; }
.hero p { margin:2px 0; color:var(--sub); font-size:15px; }
label.q { display:block; font-weight:700; margin-bottom:8px; font-size:16px; }
input[type=text], input[type=email] { width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:10px; }
.opts label { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; font-size:16px; cursor:pointer; }
.opts input { width:20px; height:20px; accent-color:var(--blue); }
.opt { font-weight:400; color:var(--sub); font-size:14px; }
.tz { font-size:14px; color:var(--sub); margin-top:4px; }
button { width:100%; font-size:18px; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--blue); color:#fff; cursor:pointer; }
button:disabled { opacity:.5; }
.err { color:var(--red); font-size:14px; min-height:20px; margin:6px 0 0; }
#done { display:none; text-align:center; }
#done h2 { color:var(--blue); margin:6px 0; }
</style>
</head>
<body>
<main>
  <div class="card hero">
    <img src="flag.png" alt="도미니카 공화국 국기">
    <h1>도미니카 공화국 아웃리치 기도 후원</h1>
    <p>2026년 10월 21일 ~ 11월 2일</p>
    <p>ANC DTS 30기 박선진</p>
  </div>
  <form id="f">
    <div class="card">
      <label class="q" for="name">성함</label>
      <input type="text" id="name" autocomplete="name" placeholder="예: 홍길동">
    </div>
    <div class="card">
      <label class="q" for="email">이메일</label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="예: name@gmail.com">
      <p class="tz">다녀와서 아웃리치 소식을 이메일로 보내 드리겠습니다.</p>
    </div>
    <div class="card">
      <label class="q">어느 시간대에 기도해 주실 수 있나요?</label>
      <div class="opts" id="opts"></div>
      <p class="tz" id="tz"></p>
    </div>
    <button type="submit" id="btn">보내기</button>
    <p class="err" id="err"></p>
  </form>
  <div class="card" id="done">
    <h2>감사합니다 🙏</h2>
    <p>알려 주신 시간에 함께 기도하는 마음으로 다녀오겠습니다.</p>
  </div>
</main>
<script>
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfj5Tl2aPW8UXb2naHZmgT7yMVHGd1ziocm5OEhY6yw4eXCmg/formResponse";
const E_NAME = "entry.887097103", E_EMAIL = "entry.1594834652", E_TIME = "entry.911906886", E_TZ = "entry.1579871928";
const SLOTS = ["아침 (6~9시)", "오전 (9~12시)", "점심 (12~2시)", "오후 (2~6시)", "저녁 (6~9시)", "밤 (9시 이후)"];
const opts = document.getElementById("opts");
SLOTS.forEach(s => {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" value="${s}"> ${s}`;
  opts.appendChild(l);
});
let tz = "알 수 없음";
try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
const off = -new Date().getTimezoneOffset();
const utc = "UTC" + (off >= 0 ? "+" : "-") + String(Math.floor(Math.abs(off) / 60)).padStart(2, "0") + ":" + String(Math.abs(off) % 60).padStart(2, "0");
const NAMES = { "Asia/Seoul": "한국", "America/Los_Angeles": "미국 서부", "America/Denver": "미국 산악", "America/Phoenix": "미국 애리조나", "America/Chicago": "미국 중부", "America/New_York": "미국 동부" };
const place = NAMES[tz] || tz;
document.getElementById("tz").textContent = "지금 계신 곳 시간 기준으로 골라 주세요.";
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = document.getElementById("name").value.trim();
  const picked = [...opts.querySelectorAll("input:checked")].map(i => i.value);
  const err = document.getElementById("err");
  if (!name) { err.textContent = "성함을 적어 주세요."; return; }
  const em = document.getElementById("email").value.trim();
  if (!em) { err.textContent = "이메일을 적어 주세요."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { err.textContent = "이메일 주소를 다시 확인해 주세요."; return; }
  if (!picked.length) { err.textContent = "시간대를 하나 이상 골라 주세요."; return; }
  err.textContent = "";
  const btn = document.getElementById("btn"); btn.disabled = true; btn.textContent = "보내는 중...";
  const body = new URLSearchParams();
  body.append(E_NAME, name);
  const email = document.getElementById("email").value.trim();
  body.append(E_EMAIL, email);
  picked.forEach(p => body.append(E_TIME, p));
  body.append(E_TZ, `${tz} (${utc})`);
  try {
    await fetch(FORM, { method: "POST", mode: "no-cors", body });
    document.getElementById("f").style.display = "none";
    document.getElementById("done").style.display = "block";
  } catch (e) {
    btn.disabled = false; btn.textContent = "보내기";
    err.textContent = "전송이 안 됐습니다. 잠시 후 다시 눌러 주세요.";
  }
});
</script>
</body>
</html>
